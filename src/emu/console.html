<header><div><div class="overline">MEB MKII / 8704 ORIGINAL FIRMWARE / LOCAL VM</div><h1>双指令台 · 中控 · IC 仪表 · HUD</h1><div class="subtitle" id="runtime-mode">三路显示 · 两路指令台</div></div><div id="runtime">正在读取本地状态</div></header>

<div id="error" role="status" aria-live="polite"></div>

<details id="shared-uart" class="panel" hidden><summary>共享串口原文</summary><pre id="shared-uart-text"></pre></details>

<main class="workspace"><div class="consoles" id="consoles"></div><div class="screens"><div id="center"></div><div class="bottom" id="secondary"></div></div></main>



<template id="console-template"><section class="panel" data-guest=""><div class="title"><span data-role="title"></span><span class="meta" data-role="pid">未运行</span></div><div class="toolbar"><button class="primary" data-action="start">启动原厂内核探测</button><button data-action="stop">停止</button><label><input type="checkbox" data-role="dtb">原厂 DTB</label><button data-action="diagnose">启动内存</button><button data-action="registers">寄存器</button></div><pre class="serial" data-role="serial"></pre><form><input data-role="command" autocomplete="off" spellcheck="false"><button data-role="send">发送 ↵</button><button type="button" data-role="wake" hidden>仅回车</button></form><div class="state" data-role="state"></div><details><summary>启动内存</summary><pre data-role="boot">尚未采集。</pre></details><details><summary>只读 QEMU 寄存器</summary><pre data-role="monitor">尚未读取。</pre></details><div class="session" data-role="session">会话：无</div></section></template>

<template id="display-template"><section class="panel" data-display=""><div class="title"><span data-role="title"></span><span class="meta" data-role="time">无实时帧</span><button data-action="frame">刷新</button></div><div class="screen"><span class="fps-overlay" data-role="fps" hidden>FPS 0.0</span><div class="empty" data-role="empty"></div><img hidden data-role="frame"></div><div class="note" data-role="note"></div></section></template>

<script>

'use strict';

const $=id=>document.getElementById(id),role=(panel,name)=>panel.querySelector('[data-role="'+name+'"]');

const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';

const consoles=[],displays=[],frames=new Map(),busy=new Set();let all={},outputs={},polling=false,connected=false,displayPolling=false;const frameRates=new Map();

for(const [name,title] of [['linux','01 / Linux 指令台'],['android','02 / Android 指令台']]){const panel=$('console-template').content.firstElementChild.cloneNode(true);panel.dataset.guest=name;role(panel,'title').textContent=title;role(panel,'command').placeholder='输入 '+name+' 命令';role(panel,'command').setAttribute('aria-label',name+' 串口命令');$('consoles').append(panel);consoles.push(panel)}

for(const [name,title,text] of [['center','03 / 中控 ABT','等待中控画面。'],['ic','04 / IC 仪表','等待 IC 画面。'],['hud','05 / HUD','等待 HUD 画面。']]){const panel=$('display-template').content.firstElementChild.cloneNode(true);panel.dataset.display=name;role(panel,'title').textContent=title;role(panel,'empty').textContent=text;role(panel,'frame').alt=name+' 实时输出';if(name==='center')panel.querySelector('.screen').classList.add('center');$(name==='center'?'center':'secondary').append(panel);displays.push(panel)}

async function api(path,body){const response=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'X-8704-Token':token,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!response.ok){let result;try{result=await response.json()}catch{result={error:'HTTP '+response.status}}throw Error(result.error)}return response}

function refreshFrameRates(now=performance.now()){for(const panel of displays){const rate=frameRates.get(panel.dataset.display),label=role(panel,'fps');if(!rate){label.textContent='FPS 0.0';label.hidden=false;continue}rate.samples=rate.samples.filter(t=>t>now-2000);const elapsed=Math.max(.001,Math.min(2,(now-rate.started)/1000));label.textContent='FPS '+(rate.samples.length/elapsed).toFixed(1);label.hidden=false}}
function recordPresentedFrame(panel,kind,version,now=performance.now()){if(kind==='capture'||!version){frameRates.delete(panel.dataset.display);return}let rate=frameRates.get(panel.dataset.display);if(!rate){rate={started:now,samples:[],version};frameRates.set(panel.dataset.display,rate)}else if(rate.version!==version){rate.samples.push(now);rate.version=version}refreshFrameRates(now)}
function schedulePresentedFrame(panel,img,kind,version){requestAnimationFrame(now=>{const current=frames.get(panel.dataset.display),rect=img.getBoundingClientRect();if(document.hidden||img.hidden||current?.kind!==kind||current?.version!==version||current?.url!==img.src||rect.width<=0||rect.height<=0||rect.right<=0||rect.bottom<=0||rect.left>=window.innerWidth||rect.top>=window.innerHeight)return;recordPresentedFrame(panel,kind,version,now)})}
function clearFrame(panel){frameRates.delete(panel.dataset.display);role(panel,'fps').textContent='FPS 0.0';role(panel,'fps').hidden=false;const state=frames.get(panel.dataset.display);if(state?.url)URL.revokeObjectURL(state.url);frames.delete(panel.dataset.display);role(panel,'frame').hidden=true;role(panel,'frame').removeAttribute('src');role(panel,'empty').hidden=false;role(panel,'time').textContent='无实时帧'}

function displayKind(name,state){return state?.available?'frame':name==='center'&&state?.foreground_available===true?'foreground':name==='center'&&state?.capture_available===true?'capture':null}

function displayVersion(state){return state?.frame_version||null}

function render(){

  const native=Object.values(all).some(state=>state.mode==='native-vlm');

  const modeLabel=$('runtime-mode');

  if(modeLabel)modeLabel.textContent=native

    ?'Exynos Auto V9 / vLM · Linux + Android + QNX'

    :'QEMU virt · 诊断模式';

  const sharedPanel=$('shared-uart'),sharedText=$('shared-uart-text'),shared=all.linux?.shared_uart_unattributed||'';

  if(sharedPanel&&sharedText){

    sharedPanel.hidden=!native||!shared;

    if(sharedText.textContent!==shared){

      const bottom=!sharedText.textContent||sharedText.scrollHeight-sharedText.scrollTop-sharedText.clientHeight<80;

      sharedText.textContent=shared;

      if(bottom)sharedText.scrollTop=sharedText.scrollHeight;

    }

  }

  let count=0;

  for(const panel of consoles){

    const name=panel.dataset.guest,state=all[name]||{},running=!!state.running;

    if(running)count++;

    role(panel,'pid').textContent=native?(state.capture_ended?'原厂 UART 留存':state.board_running?'vLM 在运行':'原厂 UART')

      :running?'PID '+state.pid+' / '+state.uptime_seconds+'s':'未运行';

    role(panel,'state').textContent=state.error||(native?(state.command_execution_verified?'UART 已连接 · 命令回显已核对':state.serial_writable?'UART 已连接':'UART 连接中'):running?'进程运行中':'未运行');

    const serial=role(panel,'serial'),bottom=serial.scrollHeight-serial.scrollTop-serial.clientHeight<80;

    serial.textContent=[state.console,state.console_pending].filter(Boolean).join('\n')||'未收到 '+name+' UART 输出。';

    if(bottom)serial.scrollTop=serial.scrollHeight;

    for(const button of panel.querySelectorAll('[data-action]')){

      button.hidden=native;

      button.disabled=native||!connected||busy.has(name)||(button.dataset.action==='start'?running:!running);

    }

    role(panel,'dtb').hidden=native;

    const writable=state.serial_writable??running;

    role(panel,'send').disabled=!connected||busy.has(name)||!writable;

    const wake=role(panel,'wake');wake.hidden=!state.native_return;wake.disabled=!connected||busy.has(name)||!writable;

    role(panel,'command').disabled=!connected||busy.has(name)||!writable;

    role(panel,'command').placeholder=native&&!writable?'等待原厂串口接入':'输入 '+name+' UART 命令';

    role(panel,'boot').textContent=state.boot_diagnostic?.text||'尚未采集。';

    role(panel,'session').textContent='会话：'+(state.session||'无');

  }

  for(const panel of displays){

    const name=panel.dataset.display,state=outputs[name],kind=displayKind(name,state);

    if(!state){clearFrame(panel);panel.querySelector('button').disabled=true;continue;}

    role(panel,'note').textContent=state.renderer;

    role(panel,'empty').textContent='等待 '+({center:'中控',ic:'IC',hud:'HUD'}[name])+' 画面。';

    const shown=frames.get(name);

    if(!kind||(shown&&shown.kind!==kind))clearFrame(panel);

    panel.querySelector('button').disabled=!kind;

  }

  const nativeCommandCount=['linux','android'].filter(name=>all[name]?.mode==='native-vlm'&&all[name].command_execution_verified===true).length;

  const liveOriginal=Object.values(outputs).filter(state=>state.original_scanout===true&&state.available===true);

  $('runtime').textContent=!connected?'本地控制器连接中断'

    :native?(Object.values(all).some(state=>state.board_running)?'原厂 vLM 整机运行中':'原厂 vLM 串口观察')

      +'\n本次原厂命令回显：'+nativeCommandCount+' / 2'

      +'\n原厂活动帧源：'+liveOriginal.length+' / 3'

      +'\n原厂界面完成：'+liveOriginal.filter(state=>state.factory_hmi_verified===true).length+' / 3'

    :'本地诊断 QEMU：'+count+' / 2';

}

async function pollDisplays(){if(displayPolling||!connected||document.hidden)return;displayPolling=true;try{outputs=await(await api('displays')).json();if(!connected)return;render();for(const panel of displays)frame(panel)}catch(error){$('error').textContent=error.message}finally{displayPolling=false}}
async function poll(){if(polling||document.hidden)return;polling=true;try{all=await(await api('status')).json();connected=true;render();await pollDisplays()}catch(error){connected=false;all={};outputs={};render();$('error').textContent=error.message}finally{polling=false}}
async function frame(panel,force=false){

  const name=panel.dataset.display,state=frames.get(name),kind=displayKind(name,outputs[name]);

  const version=displayVersion(outputs[name]);

  if(state?.loading||!kind||(!force&&state?.url&&state.kind===kind&&state.version===version))return;

  const attempt={...state,kind,version,loading:true};

  frames.set(name,attempt);

  let candidate=null;

  try{

    const query=new URLSearchParams(kind==='frame'?{display:name}:{});

    if(version)query.set('version',version);

    const params=query.toString();

    const response=await api((kind==='capture'?'center-capture':kind==='foreground'?'center-foreground':'display-frame')+(params?'?'+params:''));

    candidate=URL.createObjectURL(await response.blob());

    await new Promise((resolve,reject)=>{const test=new Image();test.onload=resolve;test.onerror=()=>reject(Error('PNG 解码失败'));test.src=candidate});

    if(frames.get(name)!==attempt||displayKind(name,outputs[name])!==kind||displayVersion(outputs[name])!==version)return;

    if(attempt.url)URL.revokeObjectURL(attempt.url);

    frames.set(name,{url:candidate,kind,version,loading:false});

    const img=role(panel,'frame');

    img.src=candidate;candidate=null;img.hidden=false;schedulePresentedFrame(panel,img,kind,version);

    img.alt=kind==='capture'?'本次中控留存 · 非实时':kind==='foreground'?'当前中控前景':name+' 实时输出';

    role(panel,'empty').hidden=true;

    role(panel,'time').textContent=(kind==='capture'?'启动画面留存 · 非实时 ':kind==='foreground'?'原厂前景 · 未合成 ':outputs[name]?.original_scanout?'原厂活动帧 ':'诊断帧 ')+new Date().toLocaleTimeString();

  }catch(error){

    if(frames.get(name)===attempt){clearFrame(panel);role(panel,'note').textContent='未取得当前帧：'+error.message}

  }finally{

    if(candidate)URL.revokeObjectURL(candidate);

    if(frames.get(name)===attempt){attempt.loading=false;if(connected&&version!==displayVersion(outputs[name]))Promise.resolve().then(()=>frame(panel))}

  }

}

async function action(panel,path,extra={}){const name=panel.dataset.guest;if(busy.has(name))return;busy.add(name);render();$('error').textContent='';try{const data=await(await api(path,{guest:name,...extra})).json();if(path==='monitor')role(panel,'monitor').textContent=data.output||'';await poll();if(path==='start')for(const output of displays)await frame(output)}catch(error){$('error').textContent=name+'：'+error.message}finally{busy.delete(name);render()}}

const centerPanel=displays.find(panel=>panel.dataset.display==='center'),touchImage=role(centerPanel,'frame');

const touchLabel=document.createElement('span');touchLabel.className='meta';touchLabel.textContent='单指触摸';centerPanel.querySelector('.title').append(touchLabel);

touchImage.style.touchAction='none';touchImage.style.userSelect='none';touchImage.draggable=false;

let pointerId=null,touchQueue=Promise.resolve(),movePending=false,touchPoint=null,touchEvents=[];

function centerGeometry(){const width=touchImage.naturalWidth,height=touchImage.naturalHeight;return(width===1560&&height===700)||(width===1920&&height===1080)?{width,height}:null}
function touchPosition(event,clamp=false){const geometry=centerGeometry();if(!geometry)return null;const{width,height}=geometry,r=touchImage.getBoundingClientRect(),scale=Math.min(r.width/width,r.height/height);if(!(scale>0))return null;const x=(event.clientX-r.left-(r.width-width*scale)/2)/scale,y=(event.clientY-r.top-(r.height-height*scale)/2)/scale;if(!clamp&&(x<0||x>=width||y<0||y>=height))return null;return{x:Math.max(0,Math.min(width-1,Math.floor(x))),y:Math.max(0,Math.min(height-1,Math.floor(y)))}}
function syncCenterGeometry(){const geometry=centerGeometry();if(!geometry)return;const host=document.getElementById('center'),pixel=host.classList.contains('native-pixel-scale');touchImage.style.width=pixel?geometry.width+'px':'';touchImage.style.height=pixel?geometry.height+'px':'';centerPanel.dataset.sourceWidth=String(geometry.width);centerPanel.dataset.sourceHeight=String(geometry.height);for(const note of host.querySelectorAll('.note'))if(note.textContent.startsWith('中控源 '))note.textContent='中控源 '+geometry.width+'×'+geometry.height+'：适配显示保留全范围；1:1 可横向查看。'}
touchImage.addEventListener('load',syncCenterGeometry);
if(typeof MutationObserver!=='undefined')new MutationObserver(syncCenterGeometry).observe(document.getElementById('center'),{attributes:true,attributeFilter:['class']});

function originalTouchPacket(x,y,phase,tick){const sensorY=Math.max(0,Math.min(1023,y)),rawX=Math.floor(x/2),pressed=phase==='down'||phase==='move';return[57,0,43,0,16,0,0,0,0,0,0,0,0,0,131,80,32,11,0,0,0,0,0,160,tick&255,pressed?17:16,16|(rawX>>6),((rawX&63)<<2)|(sensorY>>8),sensorY&255,({down:253,move:254,up:255,cancel:251})[phase]]}

function compactTouchFormat(packet){let out='';for(let i=packet.length-1;i>=0;i--){const b=packet[i];let part;if(b>=32&&b<=126&&![39,92,37].includes(b))part=String.fromCharCode(b);else if(b===37)part='%%';else part='\\'+b.toString(8).padStart(out&&/^[0-7]/.test(out)?3:1,'0');out=part+out}return out}

async function touchSerial(payload){const nonce=Array.from(crypto.getRandomValues(new Uint8Array(4)),b=>b.toString(16).padStart(2,'0')).join(''),command=`echo TB${nonce};${payload};r=$?;echo;echo TE${nonce}:$r`;if(new TextEncoder().encode(command).length>=240)throw Error('输入报文超过串口长度');await api('serial',{guest:'linux',command});const pattern=new RegExp('(?:^|\\n)TB'+nonce+'\\r?\\n([\\s\\S]*?)\\nTE'+nonce+':([0-9]+)\\r?(?:\\n|$)'),deadline=Date.now()+20000;while(Date.now()<deadline){const state=await(await api('status')).json(),match=pattern.exec(state.linux?.console||'');if(match){if(Number(match[2])!==0)throw Error('原厂输入写入失败：'+match[1].trim());return}await new Promise(resolve=>setTimeout(resolve,200))}throw Error('未收到原串口输入回执；未重发')}

async function originalTouch(point,phase,tick,path,first){const fmt=compactTouchFormat(originalTouchPacket(point.x,point.y,phase,tick));await touchSerial(`test -f /run/oem-bench-input&&(umask 077;${first?'set -C;':''}printf '${fmt}'${first?'>':'>>'}${path})`)}

let touchSenderSetup=null;
async function ensureTouchSender(){if(!touchSenderSetup)touchSenderSetup=(async()=>{await touchSerial("OEM_TP='9\\0+\\0\\20\\0\\0\\0\\0\\0\\0\\0\\0\\0\\203P \\13\\0\\0\\0\\0\\0\\240'");await touchSerial(`t8704(){ test -f /run/oem-bench-input&&(umask 077;p=/tmp/t$1;set -C;printf "$OEM_TP$2$OEM_TP$3">$p&&{ dd if=$p of=/dev/kipc bs=30;q=$?;rm $p;exit $q;});}`)})().catch(error=>{touchSenderSetup=null;throw error});return touchSenderSetup}
async function originalTouchGesture(events){if(events.length===2){await ensureTouchSender();const nonce=Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>b.toString(16).padStart(2,'0')).join(''),delta=Math.max(0,Math.min(255,Math.round((events[1].stamp-events[0].stamp)/10))),tails=events.map((e,i)=>compactTouchFormat(originalTouchPacket(e.point.x,e.point.y,e.phase,i?delta:0).slice(24)));await touchSerial(`t8704 ${nonce} '${tails[0]}' '${tails[1]}'`);return}const path='/tmp/t'+Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>b.toString(16).padStart(2,'0')).join('');let staged=false,last=events[0].stamp;try{for(let i=0;i<events.length;i++){const e=events[i],tick=i?Math.max(0,Math.min(255,Math.round((e.stamp-last)/10))):0;await originalTouch(e.point,e.phase,tick,path,i===0);staged=true;last=e.stamp}await touchSerial(`test -f /run/oem-bench-input&&(dd if=${path} of=/dev/kipc bs=30;q=$?;rm ${path};exit $q)`);staged=false}finally{if(staged)await touchSerial(`rm -f ${path}`)}}

function sendTouch(event,phase){const point=touchPosition(event,true)||touchPoint;if(!point)return;touchPoint=point;const stamp=Number.isFinite(event.timeStamp)?event.timeStamp:performance.now();if(phase==='down')touchEvents=[];const entry={point,phase,stamp};if(phase==='move'&&touchEvents.length>=63)touchEvents[touchEvents.length-1]=entry;else touchEvents.push(entry);touchLabel.textContent='触摸采集中';if(phase!=='up'&&phase!=='cancel'){movePending=false;return}const events=touchEvents;touchEvents=[];touchQueue=touchQueue.then(async()=>{try{touchLabel.textContent='触摸发送中';await originalTouchGesture(events);touchLabel.textContent='原厂输入已写入';setTimeout(()=>frame(centerPanel,true),250)}catch(error){touchSenderSetup=null;touchLabel.textContent='触摸未完成';$('error').textContent=error.message}})}

touchImage.addEventListener('pointerdown',event=>{if(pointerId!==null||event.button!==0||!connected||all.linux?.mode!=='native-vlm'||(!['frame','foreground'].includes(displayKind('center',outputs.center))||!touchPosition(event)))return;event.preventDefault();pointerId=event.pointerId;touchImage.setPointerCapture(pointerId);sendTouch(event,'down')});

touchImage.addEventListener('pointermove',event=>{if(event.pointerId!==pointerId||movePending)return;event.preventDefault();movePending=true;sendTouch(event,'move')});

for(const [name,phase]of[['pointerup','up'],['pointercancel','cancel']])touchImage.addEventListener(name,event=>{if(event.pointerId!==pointerId)return;event.preventDefault();sendTouch(event,phase);if(touchImage.hasPointerCapture(pointerId))touchImage.releasePointerCapture(pointerId);pointerId=null});

for(const panel of consoles){for(const button of panel.querySelectorAll('[data-action]'))button.onclick=()=>{const name=button.dataset.action;return name==='registers'?action(panel,'monitor',{command:'info registers'}):action(panel,name,name==='start'?{original_dtb:role(panel,'dtb').checked}:{})};role(panel,'wake').onclick=()=>action(panel,'native-return');panel.querySelector('form').onsubmit=event=>{event.preventDefault();const input=role(panel,'command');if(!input.disabled&&input.value.trim()){action(panel,'serial',{command:input.value});input.value=''}}}for(const panel of displays)panel.querySelector('button').onclick=()=>frame(panel,true);

window.addEventListener('beforeunload',()=>{for(const panel of displays)clearFrame(panel)});render();poll();setInterval(poll,1500);setInterval(pollDisplays,50);setInterval(()=>refreshFrameRates(),500);setInterval(()=>{for(const panel of displays)if(!displayVersion(outputs[panel.dataset.display]))frame(panel,true)},4000);
